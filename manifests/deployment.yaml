apiVersion: apps/v1
kind: Deployment
metadata:
  name: playground
  labels:
    app: playground
spec:
  replicas: 1
  selector:
    matchLabels:
      app: playground
  template:
    metadata:
      labels:
        app: playground
    spec:
      containers:
        - name: playground
          # GitOps switch point: change v1 -> v2 to roll the release.
          image: wil42/playground:v1
          ports:
            - containerPort: 8888
          readinessProbe:
            tcpSocket:
              port: 8888
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: playground
  labels:
    app: playground
spec:
  # LoadBalancer so k3s klipper-lb + the k3d serverlb expose it on the host.
  # The k3d cluster must be created with -p "8888:8888@loadbalancer" (setup.sh).
  type: LoadBalancer
  selector:
    app: playground
  ports:
    - name: http
      protocol: TCP
      port: 8888
      targetPort: 8888
